name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --no-deprecation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Validate source
        run: |
          npm ci
          npm run check
          npm test
      - name: Build Windows executable
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          npx --yes @yao-pkg/pkg@6.22.0 --targets node20-win-x64 --output dist/LifeTiAgent.exe agent.js
          Copy-Item config.example.json dist/config.example.json
      - name: Install WiX Toolset
        run: choco install wixtoolset --no-progress --yes
      - name: Build MSI
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "A tag deve usar versão semântica, por exemplo v1.2.3." }
          $wix = (Get-ChildItem "C:\Program Files (x86)" -Directory | Where-Object { $_.Name -like "WiX Toolset*" } | Select-Object -First 1).FullName
          if (-not $wix) { throw "WiX Toolset não foi encontrado." }
          & "$wix\bin\candle.exe" -nologo -arch x64 -dProductVersion=$version -dBuildDir="$pwd\dist" -dProjectDir="$pwd" -out dist\ installer\Product.wxs
          & "$wix\bin\light.exe" -nologo -out "dist\LifeTiAgent-$version-x64.msi" dist\Product.wixobj
      - name: Sign release files
        if: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE != '' }}
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        shell: powershell
        run: |
          [IO.File]::WriteAllBytes("signing.pfx", [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signTool) { throw "signtool.exe não foi encontrado." }
          Get-ChildItem dist -Include *.exe,*.msi -File | ForEach-Object { & $signTool sign /fd SHA256 /f signing.pfx /p $env:WINDOWS_SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Remove-Item -LiteralPath signing.pfx -Force
      - name: Generate SBOM and checksums
        shell: powershell
        run: |
          node scripts/generate-sbom.js
          .\scripts\checksums.ps1
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag dist/LifeTiAgent.exe dist/*.msi dist/sbom.cdx.json dist/SHA256SUMS.txt --verify-tag --generate-notes --title "Life TI Agent $tag"
